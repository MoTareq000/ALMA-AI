[project]
name = "alma-lesson-pipeline"
version = "0.1.0"
description = "ALMA Academy AI Lesson Generation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "groq>=0.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "requests>=2.31.0",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
