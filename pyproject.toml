[project]
name = "alma-lesson-pipeline"
version = "0.1.0"
description = "ALMA Academy AI Lesson Generation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.10.0",
    "motor>=3.7.0",
    "google-genai>=2.0.0",
    "groq>=1.0.0",
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "structlog>=24.0.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "json-repair>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
ui = [
    "streamlit>=1.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".venv", "ALMA", "node_modules", ".git", "scratch"]
